# Add a separate server block to your existing Nginx configuration.
# Replace BODYCAM_HOST with your body-camera hostname and enable TLS on this host.
# This does not replace or edit the drone site's configuration.
server {
    listen 80;
    server_name BODYCAM_HOST;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 65s;
    }
}
